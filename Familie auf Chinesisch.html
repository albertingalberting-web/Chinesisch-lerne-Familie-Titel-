<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Familie auf Chinesisch</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef6fb;--card:#fffdf5;--ink:#1f3347;--mute:#5d7185;--blue:#4a90d9;--blueS:#dcecfa;--yel:#ffe9a8;--grn:#4cae7a;--grnS:#d9f2e3;--red:#d9696b;--redS:#fbe1e1;--bd:#cfe0ee}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16212c;--card:#1f2e3d;--ink:#eaf2f9;--mute:#9db2c5;--blue:#6aaaf0;--blueS:#26405a;--yel:#5a4a1c;--grn:#5cc48d;--grnS:#1d4a33;--red:#e88486;--redS:#4f2527;--bd:#34495e}}
:root[data-theme="dark"]{--bg:#16212c;--card:#1f2e3d;--ink:#eaf2f9;--mute:#9db2c5;--blue:#6aaaf0;--blueS:#26405a;--yel:#5a4a1c;--grn:#5cc48d;--grnS:#1d4a33;--red:#e88486;--redS:#4f2527;--bd:#34495e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",system-ui,sans-serif;line-height:1.5}
.zh,[lang="zh-Hant"]{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:2rem;margin:.2em 0;text-align:center;color:var(--blue)}
.sub{text-align:center;color:var(--mute);margin:0 0 18px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:22px;padding:20px;margin:12px 0;box-shadow:0 4px 0 var(--bd)}
button{font:inherit;cursor:pointer;border:2px solid var(--bd);background:var(--card);color:var(--ink);border-radius:16px;padding:12px 16px;transition:transform .12s}
button:hover:not(:disabled){transform:translateY(-2px)}
button:disabled{opacity:.55;cursor:not-allowed}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}
.menu{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.menu button{text-align:left;font-weight:700;background:var(--blueS)}
.menu small{display:block;font-weight:400;color:var(--mute)}
.big{font-size:4rem;text-align:center;margin:.1em 0}
.py{text-align:center;font-size:1.4rem;color:var(--blue)}
.de{text-align:center;font-size:1.3rem;font-weight:700}
.note{background:var(--yel);border-radius:14px;padding:10px 14px;margin-top:10px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px;align-items:center}
.opts{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opts button{font-size:1.1rem;min-height:56px}
.opts .zh{font-size:1.6rem}
.ok{background:var(--grnS)!important;border-color:var(--grn)!important}
.bad{background:var(--redS)!important;border-color:var(--red)!important}
.bar{height:14px;background:var(--blueS);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grn);transition:width .3s}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--mute);margin-bottom:8px}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;font-weight:700}
.fb.ok{color:var(--ink)}
.stars{font-size:2.4rem;text-align:center}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.conf span{position:absolute;top:-30px;font-size:1.6rem;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}
@media(prefers-reduced-motion:reduce){.pop,.conf span{animation:none}.conf{display:none}button{transition:none}}
table{width:100%;border-collapse:collapse}td,th{padding:6px;text-align:left;border-bottom:1px solid var(--bd)}
label{display:flex;gap:8px;align-items:center}
.toast{color:var(--red);text-align:center;min-height:1.4em}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .card{max-width:380px;text-align:center}
</style>
</head>
<body>
<main id="app"></main>
<div class="conf" id="conf" aria-hidden="true"></div>
<script>
const W=[
["爸爸","bàba","Vater","Direkte Familie."],["媽媽","māma","Mutter","Direkte Familie."],["父母","fùmǔ","Eltern","Wörtlich: Vater + Mutter."],
["哥哥","gēge","älterer Bruder","Im Chinesischen gibt es kein einzelnes Wort „Bruder“: Es zählt das Alter."],["弟弟","dìdi","jüngerer Bruder","Jünger als du."],
["姐姐","jiějie","ältere Schwester","Älter als du."],["妹妹","mèimei","jüngere Schwester","Jünger als du."],
["兒子","érzi","Sohn","Direkte Familie."],["女兒","nǚ'ér","Tochter","Direkte Familie."],["孩子","háizi","Kind","Allgemein für Kind."],
["爺爺","yéye","Großvater väterlicherseits","Vater deines Vaters."],["奶奶","nǎinai","Großmutter väterlicherseits","Mutter deines Vaters."],
["外公","wàigōng","Großvater mütterlicherseits","„外“ = außen: Seite der Mutter."],["外婆","wàipó","Großmutter mütterlicherseits","„外“ = außen: Seite der Mutter."],
["伯伯","bóbo","älterer Bruder des Vaters","Deutsch nur „Onkel“, Chinesisch unterscheidet Alter und Seite."],["叔叔","shūshu","jüngerer Bruder des Vaters","Deutsch nur „Onkel“."],
["姑姑","gūgu","Schwester des Vaters","Deutsch nur „Tante“."],["舅舅","jiùjiu","Bruder der Mutter","Deutsch nur „Onkel“."],["阿姨","āyí","Schwester der Mutter","Auch höfliche Anrede für Frauen."],
["姨丈","yízhàng","Ehemann der Mutter-Schwester","Angeheirateter Onkel (Seite der Mutter)."],["姑丈","gūzhàng","Ehemann der Vater-Schwester","Angeheirateter Onkel (Seite des Vaters)."],
["伯母","bómǔ","Ehefrau des älteren Bruders des Vaters","Angeheiratete Tante."],["嬸嬸","shěnshen","Ehefrau des jüngeren Bruders des Vaters","Angeheiratete Tante."],["舅媽","jiùmā","Ehefrau des Bruders der Mutter","Angeheiratete Tante."],
["堂哥","tánggē","älterer männlicher Cousin väterlicherseits","„堂“ = gleicher Familienname wie du."],["堂弟","tángdì","jüngerer männlicher Cousin väterlicherseits","„堂“ = gleicher Familienname wie du."],
["表哥","biǎogē","älterer männlicher Cousin mütterlicherseits oder über eine Tante","„表“ = anderer Familienname."],["表姐","biǎojiě","ältere weibliche Cousine mütterlicherseits oder über eine Tante","„表“ = anderer Familienname."],
["表弟","biǎodì","jüngerer männlicher Cousin mütterlicherseits oder über eine Tante","„表“ = anderer Familienname."],["表妹","biǎomèi","jüngere weibliche Cousine mütterlicherseits oder über eine Tante","„表“ = anderer Familienname."],
["先生","xiānsheng","Ehemann","Auch „Herr“."],["太太","tàitai","Ehefrau","Auch „Frau“ (Anrede)."]
].map(([zh,py,de,note])=>({zh,py,de,note}));
const MODES={cd:"Chinesisch → Deutsch",dc:"Deutsch → Chinesisch",hv:"Hörverstehen"};
const $=s=>document.getElementById(s);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const load=()=>{try{return JSON.parse(localStorage.getItem("fac")||"null")||{}}catch(e){return{}}};
const save=d=>{try{localStorage.setItem("fac",JSON.stringify(d))}catch(e){}};
let S=load();S.modes=S.modes||{};S.hist=S.hist||[];
let cfg={n:10,replay:true},card=0,Q=null,played=0,audioDone=false;

/* Sprache */
function speak(text,cb){
  const t=$("toast");if(t)t.textContent="";
  if(!("speechSynthesis" in window)){if(t)t.textContent="Dein Browser unterstützt keine Sprachausgabe.";cb&&cb(false);return}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang="zh-TW";u.rate=.8;
    const v=speechSynthesis.getVoices().find(v=>v.lang.replace("_","-")==="zh-TW")||speechSynthesis.getVoices().find(v=>v.lang.startsWith("zh"));
    if(v)u.voice=v;else if(speechSynthesis.getVoices().length&&t)t.textContent="Keine chinesische Stimme gefunden – bitte eine installieren.";
    let done=false;const fin=ok=>{if(!done){done=true;cb&&cb(ok)}};
    u.onend=()=>fin(true);u.onerror=()=>{if(t)t.textContent="Wiedergabe fehlgeschlagen.";fin(false)};
    speechSynthesis.speak(u);
  }catch(e){if(t)t.textContent="Wiedergabe fehlgeschlagen.";cb&&cb(false)}
}
if("speechSynthesis" in window)speechSynthesis.onvoiceschanged=()=>{};

/* Ansichten */
const head=(back=true)=>`${back?`<div class="row" style="justify-content:flex-start"><button onclick="guard()">← Zurück zum Menü</button></div>`:""}`;
function stopSpeech(){try{if("speechSynthesis" in window)speechSynthesis.cancel()}catch(e){}}
function confirmBox(msg,yes,no,onYes){const d=document.createElement("div");d.className="modal";d.innerHTML=`<div class="card" role="alertdialog" aria-modal="true"><p>${msg}</p><div class="row"><button id="cn">${no}</button><button class="btn" id="cy">${yes}</button></div></div>`;document.body.appendChild(d);$("cn").onclick=()=>d.remove();$("cy").onclick=()=>{d.remove();onYes()};$("cn").focus()}
function leave(){Q=null;stopSpeech();menu()}
function guard(){if(Q&&!Q.over&&Q.done>0)confirmBox("Aktuelle Runde abbrechen?","Ja, abbrechen","Weiterspielen",leave);else leave()}
function menu(){
  $("app").innerHTML=`<h1>Familie auf Chinesisch</h1><p class="sub">Lerne chinesische Familienbezeichnungen spielerisch!</p>
  <div class="menu">
  <button onclick="cards()">📇 Lernkarten<small>Karten mit Pinyin, Aussprache und Beispiel</small></button>
  <button onclick="start('cd')">🇨🇳→🇩🇪 Chinesisch → Deutsch<small>Wähle die deutsche Bedeutung</small></button>
  <button onclick="start('dc')">🇩🇪→🇨🇳 Deutsch → Chinesisch<small>Wähle das chinesische Wort</small></button>
  <button onclick="start('hv')">🎧 Hörverstehen<small>Hör zu und wähle die Bedeutung</small></button>
  <button onclick="progress()">📊 Lernfortschritt<small>Deine Ergebnisse</small></button></div>
  <div class="card"><b>Einstellungen</b><div class="row" style="justify-content:flex-start">
  <label>Fragen pro Runde: <select id="n" onchange="cfg.n=+this.value">${[5,10,20].map(n=>`<option ${n==cfg.n?"selected":""}>${n}</option>`).join("")}</select></label>
  <label><input type="checkbox" ${cfg.replay?"checked":""} onchange="cfg.replay=this.checked"> Wiederholen im Hörtest erlauben</label></div></div>`;
}
function cards(){
  const w=W[card];
  $("app").innerHTML=`${head()}<div class="card pop"><div class="top"><span>Karte ${card+1} von ${W.length}</span></div>
  <div class="big zh" lang="zh-Hant">${w.zh}</div><div class="py">${w.py}</div><div class="de">${w.de}</div>
  <div class="note">💡 ${w.note}</div>
  <div class="note" style="background:var(--blueS)">Beispiel: <span class="zh" lang="zh-Hant">這是我的${w.zh}。</span><br><small>Zhè shì wǒ de ${w.py}. – Das ist mein/e ${w.de}.</small></div>
  <div class="row"><button class="btn" onclick="speak('${w.zh}')" aria-label="Aussprache abspielen">🔊 Anhören</button></div><div class="toast" id="toast" role="status"></div>
  <div class="row"><button onclick="card=(card+W.length-1)%W.length;cards()">← Zurück</button><button onclick="card=(card+1)%W.length;cards()">Weiter →</button></div></div>`;
}
function start(mode){
  Q={mode,n:cfg.n,items:shuffle(W).slice(0,cfg.n),i:0,ok:0,done:0,locked:false,over:false};ask();
}
function ask(){
  const w=Q.items[Q.i],hv=Q.mode==="hv",dc=Q.mode==="dc";
  const pool=shuffle(W.filter(x=>x.de!==w.de&&x.zh!==w.zh)).slice(0,3);
  const opts=shuffle([w,...pool]);Q.opts=opts;Q.locked=false;played=0;audioDone=!hv;
  const acc=Q.done?(Q.ok/Q.done*100).toFixed(1):"0.0";
  const prompt=hv?`<div class="big" aria-hidden="true">🎧</div><div class="de">Was bedeutet das, was du hörst?</div><div class="row"><button class="btn" id="play" onclick="playQ()">🔊 Abspielen</button></div>`
   :dc?`<div class="de" style="font-size:2rem">${w.de}</div>`:`<div class="big zh" lang="zh-Hant">${w.zh}</div>`;
  $("app").innerHTML=`${head()}<div class="card"><div class="top"><span>Frage ${Q.i+1} von ${Q.n}</span><span>✅ ${Q.ok} · Quote ${acc} %</span></div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${Q.n}" aria-valuenow="${Q.done}"><i style="width:${Q.done/Q.n*100}%"></i></div>
  <p class="sub" style="margin:12px 0 0">${MODES[Q.mode]}</p>${prompt}
  <div class="opts" style="margin-top:14px">${opts.map((o,k)=>`<button id="o${k}" ${hv?"disabled":""} onclick="pick(${k})">${dc?`<span class="zh" lang="zh-Hant">${o.zh}</span>`:o.de}</button>`).join("")}</div>
  <div id="fb"></div><div class="toast" id="toast" role="status"></div></div>`;
}
function playQ(){
  const w=Q.items[Q.i];
  if(!cfg.replay&&played>0)return;
  played++;$("play").disabled=true;
  speak(w.zh,ok=>{
    audioDone=true;
    if(!ok){$("toast").textContent+=" Textversion: "+w.zh}
    if(!Q.locked)Q.opts.forEach((_,k)=>{$("o"+k).disabled=false});
    $("play").disabled=!cfg.replay&&played>0;
  });
}
function pick(k){
  if(Q.locked||!audioDone)return;Q.locked=true;
  const w=Q.items[Q.i],good=Q.opts[k]===w;Q.done++;
  const m=S.modes[Q.mode]=S.modes[Q.mode]||{done:0,ok:0};m.done++;if(good){Q.ok++;m.ok++}save(S);
  Q.opts.forEach((o,j)=>{const b=$("o"+j);b.disabled=true;if(o===w)b.classList.add("ok");else if(j===k)b.classList.add("bad")});
  const last=Q.i+1>=Q.n;
  $("fb").innerHTML=`<div class="fb ${good?"ok pop":"bad"}" style="background:${good?"var(--grnS)":"var(--redS)"}">${good?"🎉 Richtig! Super gemacht!":"Nicht ganz – nicht schlimm, du lernst gerade!"}
  <div><span class="zh" lang="zh-Hant">${w.zh}</span> (${w.py}) = ${w.de}</div><small>${w.note}</small></div>
  <div class="row"><button onclick="speak('${w.zh}')">🔊 Nochmal hören</button><button class="btn" id="next" onclick="next()">${last?"Ergebnis ansehen":"Weiter →"}</button></div>`;
  if(good)confetti();$("next").focus();
}
function next(){Q.i++;if(Q.i>=Q.n)finish();else ask()}
function finish(){
  Q.over=true;const p=Q.ok/Q.n*100;
  S.hist.unshift({mode:Q.mode,n:Q.n,ok:Q.ok,date:new Date().toLocaleDateString("de-DE")});S.hist=S.hist.slice(0,20);save(S);
  const st=p>=90?3:p>=60?2:1,msg=p>=90?"Fantastisch – du bist ein Profi!":p>=60?"Sehr gut! Mit etwas Übung wird es perfekt.":"Guter Anfang! Jede Runde macht dich besser – probier es gleich nochmal.";
  $("app").innerHTML=`<div class="card pop"><h1>Geschafft!</h1><div class="stars" aria-label="${st} von 3 Sternen">${"⭐".repeat(st)}${"☆".repeat(3-st)}</div>
  <table><tr><td>Fragen gesamt</td><td>${Q.n}</td></tr><tr><td>Richtig</td><td>${Q.ok}</td></tr><tr><td>Falsch</td><td>${Q.n-Q.ok}</td></tr><tr><td>Trefferquote</td><td>${p.toFixed(1)} %</td></tr></table>
  <p class="de">${msg}</p><div class="row"><button onclick="menu()">Zurück zum Menü</button><button class="btn" onclick="start('${Q.mode}')">Nochmal spielen</button></div></div>`;
  if(p>=60)confetti();
}
function progress(){
  const ms=Object.keys(MODES),tot=ms.reduce((a,k)=>a+(S.modes[k]?.done||0),0),ok=ms.reduce((a,k)=>a+(S.modes[k]?.ok||0),0),pr=tot?ok/tot*100:0;
  $("app").innerHTML=`${head()}<div class="card"><h1 style="font-size:1.6rem">Lernfortschritt</h1>
  <table><tr><td>Beantwortet</td><td>${tot}</td></tr><tr><td>Richtig</td><td>${ok}</td></tr><tr><td>Falsch</td><td>${tot-ok}</td></tr><tr><td>Trefferquote</td><td>${pr.toFixed(1)} %</td></tr></table>
  <div class="bar" style="margin:10px 0"><i style="width:${pr}%"></i></div>
  <p class="de">${tot?(pr>=80?"Weiter so, super Leistung!":"Du bist auf einem guten Weg – bleib dran!"):"Starte dein erstes Quiz!"}</p>
  <h3>Nach Modus</h3><table>${ms.map(k=>{const m=S.modes[k]||{done:0,ok:0};return`<tr><td>${MODES[k]}</td><td>${m.ok}/${m.done}</td><td>${m.done?(m.ok/m.done*100).toFixed(1):"0.0"} %</td></tr>`}).join("")}</table>
  <h3>Letzte Runden</h3>${S.hist.length?`<table>${S.hist.slice(0,8).map(h=>`<tr><td>${h.date}</td><td>${MODES[h.mode]}</td><td>${h.ok}/${h.n}</td></tr>`).join("")}</table>`:"<p>Noch keine Runden.</p>"}
  <div class="row"><button onclick="confirmBox('Fortschritt wirklich löschen?','Ja, löschen','Abbrechen',()=>{S={modes:{},hist:[]};save(S);progress()})">Fortschritt zurücksetzen</button></div></div>`;
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const c=$("conf");c.innerHTML="";
  for(let i=0;i<14;i++){const s=document.createElement("span");s.textContent=["⭐","🎉","✨"][i%3];s.style.left=Math.random()*100+"%";s.style.animationDelay=Math.random()*.4+"s";c.appendChild(s)}
  setTimeout(()=>c.innerHTML="",2000);
}
document.addEventListener("keydown",e=>{if(Q&&!Q.over&&!Q.locked&&"1234".includes(e.key)){const b=$("o"+(+e.key-1));if(b&&!b.disabled)b.click()}});
menu();
</script>
</body>
</html>
